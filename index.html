<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel= "stylesheet" href= "styles.css">
</head>
<body>
    <div class = "calculator">
    <div class = "display">00000</div>
    <div class = "row">
        <button id = "7">7</button>
        <button id = "8">8</button>
        <button id = "9">9</button>
        <button id = "division">÷</button>
    </div>
    <div class = "row">
        <button id = "4">4</button>
        <button id = "5">5</button>
        <button id = "6">6</button>
        <button id = "multiplication">x</button>
    </div>
    <div class = "row">
        <button id = "1">1</button>
        <button id = "2">2</button>
        <button id = "3">3</button>
        <button id = "minus">-</button>
    </div>
    <div class = "row">
        <button id = "0">0</button>
        <button id = "decimal">.</button>
        <button id = "equal">=</button>
        <button id = "addition">+</button>
    </div>
    <button id = "clear">Clear</button>
    </div>
<script>
    //calculator inputs

    const para = document.querySelector(".display");
    //current and next number are empty strings as it allows for the numbers to concatenate
    let currentNumber = ""; //the first number
    let nextNumber = ""; //the second number
    let currentOperation = null; //the math operation
    let operationDisplay; //the display
    let firstInput = false; //check if the first number input is finished (updates when an operation is pressed)
    let resultObtain = false; //check if a result has been obtained to see if the calculator continues or resets. If a new number is entered after a calculation, calculator is reset.

    const decimal = document.getElementById("decimal")
    decimal.addEventListener(
        "click", () => {
            decimalPlace();
        }
    );

    document.addEventListener("keydown", (e) => { //arithmetic keyboard function
        if(e.key === ".") {
            decimalPlace();
        }
        if(e.key === "+") {
            arithmetic(add, "+");
        }
        if(e.key === "-") {
            arithmetic(subtract, "-");
        }
        if(e.key === "/") {
            e.preventDefault();
            arithmetic(divide, "÷");
        }
        if(e.key === "*") {
            arithmetic(multiply, "x");
        }
        if(e.key === "=" || e.key === "Enter") {
            if (currentNumber != "" && operate != null && nextNumber != "") {
                equals();
            };
        }
    });

    document.addEventListener("keydown", (e) => { //number keyboard function
        if(e.key >= "0" && e.key <= "9") {
            switch (e.key) {
                case "1": 
                    number(1);
                    break;
                case "2": 
                    number(2);
                    break;
                case "3": 
                    number(3);
                    break;
                case "4": 
                    number(4);
                    break;
                case "5": 
                    number(5);
                    break;
                case "6": 
                    number(6);
                    break;
                case "7": 
                    number(7);
                    break;
                case "8": 
                    number(8);
                    break;
                case "9": 
                    number(9);
                    break;
                case "0": 
                    number(0);
                    break;
            }
        }
    });

    const one = document.getElementById("1")
    one.addEventListener(
        "click", () => {
            number(1);
        }
    );

    const two = document.getElementById("2")
    two.addEventListener(
        "click", () => {
            number(2);
        }
    );

    const three = document.getElementById("3")
    three.addEventListener(
        "click", () => {
            number(3);
        }
    );

    const four = document.getElementById("4")
    four.addEventListener(
        "click", () => {
            number(4);
        }
    );

    const five = document.getElementById("5")
    five.addEventListener(
        "click", () => {
            number(5);
        }
    );

    const six = document.getElementById("6")
    six.addEventListener(
        "click", () => {
            number(6);
        }
    );

    const seven = document.getElementById("7")
    seven.addEventListener(
        "click", () => {
            number(7);
        }
    );

    const eight = document.getElementById("8")
    eight.addEventListener(
        "click", () => {
            number(8);
        }
    );

    const nine = document.getElementById("9")
    nine.addEventListener(
        "click", () => {
            number(9);
        }
    );

    const zero = document.getElementById("0")
    zero.addEventListener(
        "click", () => {
            number(0);
        }
    );

    const addition = document.getElementById("addition")
    addition.addEventListener(
        "click", () => {
            arithmetic(add, "+");
        }
    );

    const minus = document.getElementById("minus")
    minus.addEventListener(
        "click", () => {
            arithmetic(subtract, "-");
        }
    );

    const division = document.getElementById("division")
    division.addEventListener(
        "click", () => {
            arithmetic(divide, "÷");
        }
    );

    const multiplication = document.getElementById("multiplication")
    multiplication.addEventListener(
        "click", () => {
            arithmetic(multiply, "x");
        }
    );

    const equal = document.getElementById("equal")
    equal.addEventListener(
        "click", () => {
            if (currentNumber != "" && operate != null && nextNumber != "") {
                equals();
            }
        }
    );

    const clear = document.getElementById("clear")
    clear.addEventListener(
        "click", () => {
        reset();
        }
    );

    const deletion = document.addEventListener(
        "keydown", (e) => {
            if (e.key === "Delete" || e.key === "Backspace" && nextNumber === "" && currentOperation === null) { //if on the first number and there is no operation present
                currentNumber = currentNumber.slice(0, -1);
                para.textContent = currentNumber;
            }
            if (e.key === "Delete" || e.key === "Backspace" && nextNumber === "" && currentOperation != null) { //delete operation if the next number is blank
                currentOperation = null;
                para.textContent = currentNumber;
                firstInput = false;
            }
            if (e.key === "Delete" || e.key === "Backspace" && nextNumber != "") { //delete the next number if it is present
                nextNumber = nextNumber.slice(0, -1);
                para.textContent = `${operationDisplay} ${nextNumber}`;
            }
        }
    );

    //calculator operations

    function number(a) {
        if (firstInput === false) {//add the number to the empty string of the first number
            currentNumber += a;
            para.textContent = currentNumber;
        }
        if (firstInput === true) {//add the number to the empty string of the next number
            nextNumber += a;
            para.textContent = `${operationDisplay} ${nextNumber}`;
        }
        if (resultObtain === true && currentOperation === null) {//reset if a new number is pressed and a result is obtained
            reset();
            currentNumber += a;
            para.textContent = currentNumber;
        }
    };
    
    function arithmetic(a, b) {
        if (currentOperation != null && nextNumber != "") {
            equals();
            currentOperation = a;
            operationDisplay = `${currentNumber} ${b}`;
            para.textContent = operationDisplay;
        }
        if (currentOperation === a) {
            operationDisplay = `${currentNumber} ${b}`;
            para.textContent = operationDisplay;
        }
        else {
            currentOperation = a;
            firstInput = true;
            operationDisplay = `${currentNumber} ${b}`;
            para.textContent = operationDisplay;
        }
    };

    function decimalPlace() {
        if (currentOperation === null && !currentNumber.includes(".")) {
                currentNumber += ".";
                para.textContent = currentNumber;
            };
        if (currentOperation != null && !nextNumber.includes(".")) {
                nextNumber += ".";
                para.textContent = `${operationDisplay} ${nextNumber}`;
            };
    };

    function equals() {
        let currentNumberInt = parseFloat(currentNumber); //convert string to integer
        let nextNumberInt = parseFloat(nextNumber); //use parseFloat as partInt ignores the dot
        if (currentNumberInt === 0 && nextNumberInt === 0 && currentOperation === divide) {//check if 0 is divided by 0
            reset();
            para.textContent = "ERROR";
        }
        else {
            result = operate(currentNumberInt, nextNumberInt, currentOperation);
            para.textContent = result;
            currentNumber = result.toString(); //convert back to string for the delete button to function correctly
            nextNumber = "";
            resultObtain = true;
            currentOperation = null;
        }
    };

    function reset() {
        currentNumber = ""; 
        nextNumber = "";
        firstInput = false
        currentOperation = null;
        para.textContent = "00000";
        resultObtain = false;
    };

    function add(a, b) {
        return a + b;
    };

    function subtract(a, b) {
        return a - b;
    };

    function multiply(a, b) {
        return a * b;
    };

    function divide(a, b) {
        return a / b;
    };

    function operate(a, b, c) {
        if (!a && !b) { //check if both numbers are not numbers
            return 0;
        }
        if (!a) { //return second number if first has no numbers
            return b;
        }
        if (!b) { //return first number if second has no numbers
            return a;
        }
        else {
            return parseFloat(c(a, b).toFixed(10));
        } //parseFloat removes the extra 0s created by a set toFixed
        //toFixed will return a string, parseFloat turns the string into an integer and removes the 0s
    };
</script>
</body>
</html>
